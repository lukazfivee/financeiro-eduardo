name: Gerar EXE Financeiro Eduardo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - desktop/**
      - package.json
      - .github/workflows/build-windows.yml

permissions:
  contents: write

jobs:
  build:
    name: Gerar Financeiro Eduardo 0.2.0
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Gerar executavel
        run: npm run build:win

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Financeiro-Eduardo-Windows-0.2.0
          path: dist/*.exe
          if-no-files-found: error

      - name: Anexar executavel na release v0.2.0
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view v0.2.0 >/dev/null 2>&1; then
            gh release create v0.2.0 \
              --target main \
              --title "Financeiro Eduardo v0.2.0" \
              --notes "Financeiro Eduardo v0.2.0"
          fi
          gh release upload v0.2.0 dist/*.exe --clobber
