name: Gerar EXE Financeiro CENGTEC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - desktop/**
      - public/**
      - src/**
      - schema.sql
      - package.json
      - .github/workflows/build-windows.yml

permissions:
  contents: write

jobs:
  build:
    name: Gerar Financeiro CENGTEC 0.4.0
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Gerar executavel
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Financeiro-CENGTEC-Windows-0.4.0
          path: dist/*.exe
          if-no-files-found: error

      - name: Anexar executavel na release v0.4.0
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view v0.4.0 >/dev/null 2>&1; then
            gh release create v0.4.0 \
              --target main \
              --title "Financeiro CENGTEC v0.4.0" \
              --notes "Financeiro CENGTEC v0.4.0: nova identidade CENGTEC, Visão Geral privada por perfil e Serviços compartilhados."
          fi
          gh release upload v0.4.0 dist/*.exe --clobber
