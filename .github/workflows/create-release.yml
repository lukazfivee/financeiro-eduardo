name: Criar Release Financeiro Eduardo 0.2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Criar release v0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "Release v0.2.0 ja existe."
          else
            gh release create v0.2.0 \
              --target main \
              --title "Financeiro Eduardo v0.2.0" \
              --notes "## Financeiro Eduardo v0.2.0\n\nNova versao do sistema financeiro com interface renovada e novos modulos.\n\n### Novidades\n- Dashboard financeiro moderno e responsivo\n- Modo claro e modo noturno com preferencia salva\n- Modulo Servicos separado do financeiro pessoal\n- Receitas e custos profissionais independentes\n- Resultado e lucro por servico\n- Controle por cliente e nome do servico\n- Historico profissional separado\n- Integracao com Cloudflare Worker e D1\n- Suporte a Windows via aplicativo desktop\n\n### Plataforma\nWindows, navegador e PWA compartilham os mesmos dados hospedados no Cloudflare D1.\n\nO executavel do Windows sera anexado a esta release assim que a compilacao da versao 0.2.0 for concluida."
          fi
