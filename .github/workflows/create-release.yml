name: Criar Release Financeiro CENGTEC 0.4.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Criar release v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.4.1 >/dev/null 2>&1; then
            echo "Release v0.4.1 ja existe."
          else
            gh release create v0.4.1 \
              --target main \
              --title "Financeiro CENGTEC v0.4.1" \
              --notes "## Financeiro CENGTEC v0.4.1\n\n### Correção\n- Logo oficial substituída pela imagem correta fornecida pela CENGTEC\n- Visão Geral continua exclusiva por perfil\n- Serviços continuam compartilhados entre perfis autenticados\n\nO executável será anexado automaticamente após a compilação."
          fi
