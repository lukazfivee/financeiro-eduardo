name: Criar Release Financeiro CENGTEC 0.4.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Criar release v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo "Release v0.4.0 ja existe."
          else
            gh release create v0.4.0 \
              --target main \
              --title "Financeiro CENGTEC v0.4.0" \
              --notes "## Financeiro CENGTEC v0.4.0\n\n### Novidades\n- Nova identidade Financeiro CENGTEC com logo oficial\n- Visão Geral exclusiva para cada perfil\n- Serviços compartilhados entre todos os perfis autenticados\n- Dados de Serviços separados dos saldos pessoais\n- Aplicativo Windows portátil atualizado\n\n### Plataforma\nWindows, navegador e PWA usam os mesmos dados persistidos no Cloudflare D1.\n\nO executável será anexado automaticamente após a compilação."
          fi
